<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="计算机网络、数据库、缓存并发等八股知识点的交互式可视化演示合集。">
    <title>算法可视化演示 | Algorithm Visualizations</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ?v 版本号用于强制刷新缓存，改动后自增即可 -->
    <link rel="stylesheet" href="css/viz.css?v=9">
</head>
<body>

    <div class="app-layout">

        <!-- 左侧：分类折叠导航 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-wave-square"></i> 演示列表</h2>
            </div>
            <ul class="demo-list" id="demo-list"></ul>
            <div class="sidebar-foot">
                <p>点分类展开子菜单。每个演示都能自己调参数，边点边看流程怎么走。</p>
            </div>
        </aside>

        <!-- 右侧：舞台 -->
        <div class="main">
            <header class="main-header">
                <a href="../../index.html" class="home-link" title="返回工具箱主页">
                    <i class="fas fa-arrow-left"></i> <span>工具箱</span>
                </a>
                <button class="icon-btn" id="sidebar-toggle" title="展开/收起列表">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="header-titles">
                    <h1 id="stage-title">算法可视化演示</h1>
                    <p id="stage-blurb"></p>
                </div>
                <div class="brand">可视化演示</div>
            </header>

            <main class="stage" id="stage"></main>
        </div>
    </div>

    <!-- 按依赖顺序加载；普通 script、非 module，file:// 可用 -->
    <script src="js/core.js?v=9"></script>
    <!-- 计算机网络 -->
    <script src="js/tcp-congestion.js?v=9"></script>
    <script src="js/tcp-window.js?v=9"></script>
    <script src="js/tcp-handshake.js?v=9"></script>
    <script src="js/http-evolution.js?v=9"></script>
    <script src="js/tls-handshake.js?v=9"></script>
    <!-- 数据库 -->
    <script src="js/mvcc.js?v=9"></script>
    <script src="js/bplus-tree.js?v=9"></script>
    <!-- 缓存与并发 -->
    <script src="js/cache-problems.js?v=9"></script>
    <script src="js/singleflight.js?v=9"></script>
    <!-- 算法与其它 -->
    <script src="js/fsrs.js?v=9"></script>
    <script src="js/main.js?v=9"></script>
</body>
</html>
